<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUR AMAZING DATE!!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="question">I have a question for you...</h1>
  <h2 id="date">Will you go on a date with me? 🥰 </h2>
  <p id="message">Choose wisely...</p>
  <button id="yesButton">YES ❤️</button>
  <button id="noButton">NO 🙄</button>
  <input type="date" id="datePicker" class="hidden">
  <input type="time" id="timePicker" class="hidden">
  <button id="confirmButton" class="hidden">It's a date 🤵🏻‍♂️🌹 </button>
  <script src="script.js"></script>
</body>
</html>
